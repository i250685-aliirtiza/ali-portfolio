# Replace __HOST__ only after inspecting existing virtual hosts.
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;
    root /opt/ali-portfolio/current/dist;
    index index.html;
    server_tokens off;
    autoindex off;
    client_max_body_size 1k;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    location = /api/public/projects { include /etc/nginx/snippets/ali-portfolio-api.conf; }
    location = /api/public/academics { include /etc/nginx/snippets/ali-portfolio-api.conf; }
    location = /api/public/status { include /etc/nginx/snippets/ali-portfolio-api.conf; }
    location /api/ { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(env|json|sqlite|db|bak|key|pem|log|map)$ { return 404; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ =404; }
}
